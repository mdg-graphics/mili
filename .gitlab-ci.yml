workflow:
 rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Doc\]|\(Doc\)|Doc:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: always  # Runs tests when changes are committed to main
    - when: never

include:
  - project: 'lc-templates/id_tokens'
    file: 'id_tokens.yml'

stages:
  - test
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: normal

.slurm-toss-4:
  variables:
    NNODES: 1
    NPROCS: 56
    QUEUE: pdebug
    INTEG_WALL_TIME: 15

.slurm:
  variables:
    JACAMAR_SCHEDULER_DEBUG: true
    LLNL_SLURM_SCHEDULER_PARAMETERS: "-N $NNODES -n $NPROCS -p $QUEUE -t $INTEG_WALL_TIME"

.build-mili-xmilics:
  variables:
    BUILD_SPEC: ${SYS_TYPE}-${COMPILER_SPEC}
  script:
    - configure.py -hc host-configs/${BUILD_SPEC}.cmake
    - cd build-${BUILD_SPEC}-relwithdebinfo
    - make

.run-tests:
  script:
    - cd ../test/
    - mdgtest/RunTest.py -c ../build-${BUILD_SPEC}-relwithdebinfo --compiler-family ${COMPILER_FAMILY} -s all
    - any_mili_failed=$?
    - mdgtest/RunTest.py -c ../build-${BUILD_SPEC}-relwithdebinfo/bin/xmilics -s all
    - any_xmilics_failed=$?
    - any_failed=$(( $any_mili_failed + $any_xmilics_failed ))
    - echo "Any failed $any_failed"
    - exit $any_failed

.toss4:
  variables:
    SYS_TYPE: toss_4_x86_64_ib

.toss4-intel-classic:
  extends: .toss4
  variables:
    COMPILER_SPEC: intel_classic@2021.6.0
    COMPILER_FAMILY: intel
  before_script:
    - module load cmake/3.30.5
    - module load intel-classic/2021.6.0
    - module load python/3.13.2

.toss4-gcc:
  extends: .toss4
  variables:
    COMPILER_SPEC: gcc@13.3.1
    COMPILER_FAMILY: gnu
  before_script:
    - module load cmake/3.30.5
    - module load gcc/13.3.1
    - module load python/3.13.2

toss4_intel_classic_slurm_mili:
  stage: test
  variables:
   JACAMAR_SCHEDULER_DEBUG: true
  tags:
    - rzhound
    - slurm
    - batch
  extends:
    - .toss4-intel-classic
    - .slurm-toss-4
    - .slurm
    - .build-mili-xmilics
  script:
    - !reference [ .build-mili-xmilics, script ]
    - !reference [ .run-tests, script ]

toss4_gcc_slurm_mili:
  stage: test
  variables:
   JACAMAR_SCHEDULER_DEBUG: true
  tags:
    - rzhound
    - slurm
    - batch
  extends:
    - .toss4-gcc
    - .slurm-toss-4
    - .slurm
    - .build-mili-xmilics
  script:
    - !reference [ .build-mili-xmilics, script ]
    - !reference [ .run-tests, script ]

github-sync:
  variables:
    GITHUB_REPO: git@github.com:mdg-graphics/mili.git
    GITLAB_REMOTE: ssh://git@rzgitlab.llnl.gov:7999/mdg/mili/mili.git
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never
  stage: deploy
  tags:
    - rzwhippet
    - batch
  script:
    - git clone $GITHUB_REPO
    - cd mili
    - git remote add gitlab $GITLAB_REMOTE
    - git remote -v
    - git pull gitlab main
    - git push
